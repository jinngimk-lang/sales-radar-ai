name: Apply frontend type contracts

on:
  push:
    branches:
      - fix/market-radar-and-contact-depth
    paths:
      - .github/scripts/fix_frontend_type_contracts.py
      - .github/workflows/apply-frontend-type-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-radar-and-contact-depth
          fetch-depth: 0
      - run: python3 .github/scripts/fix_frontend_type_contracts.py
      - run: |
          rm .github/scripts/fix_frontend_type_contracts.py
          rm .github/workflows/apply-frontend-type-contracts.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy frontend type contracts"
          git push origin HEAD:fix/market-radar-and-contact-depth

name: Runtime Credential Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      BACKEND_ORIGIN: ${{ secrets.BACKEND_ORIGIN }}
      NEON_PROJECT_ID_VAR: ${{ vars.NEON_PROJECT_ID }}
      VERCEL_PROJECT_ID_VAR: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          check() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=absent\n' "$name"
            fi
          }
          for name in \
            NEON_API_KEY VERCEL_TOKEN RAILWAY_TOKEN RENDER_API_KEY \
            DATABASE_URL JWT_SECRET EXA_API_KEY OPENAI_API_KEY \
            QWEN_API_KEY GLM_API_KEY KIMI_API_KEY BACKEND_ORIGIN \
            NEON_PROJECT_ID_VAR VERCEL_PROJECT_ID_VAR; do
            check "$name"
          done

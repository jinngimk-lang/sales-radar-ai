name: GitHub Secret Capability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-secret-capability-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repository secret API with harmless value
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          key_status=$(curl -sS -o /tmp/secret-public-key.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key")
          printf 'repositorySecretPublicKeyStatus=%s\n' "$key_status"

          printf 'capability-probe' | gh secret set AGENT_CAPABILITY_PROBE --repo "$GITHUB_REPOSITORY" >/tmp/secret-set.out 2>/tmp/secret-set.err
          set_status=$?
          printf 'repositorySecretSetExit=%s\n' "$set_status"

          if [ "$set_status" -eq 0 ]; then
            gh secret delete AGENT_CAPABILITY_PROBE --repo "$GITHUB_REPOSITORY" >/tmp/secret-delete.out 2>/tmp/secret-delete.err
            delete_status=$?
            printf 'repositorySecretDeleteExit=%s\n' "$delete_status"
          else
            printf 'repositorySecretDeleteExit=not-attempted\n'
          fi

          exit 0

name: Remove unused revenue live import

on:
  push:
    branches:
      - feat/gpt-minimal-workspace
    paths:
      - .github/workflows/remove-unused-shield-check.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpt-minimal-workspace
          fetch-depth: 0
      - name: Remove unused ShieldCheck import
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/features/revenue/RevenueLiveOpsPanel.tsx')
          source = path.read_text()
          old = '  ShieldCheck,\n'
          if old not in source:
              raise SystemExit('ShieldCheck import was not found')
          path.write_text(source.replace(old, '', 1))
      - name: Remove one-time workflow
        run: rm .github/workflows/remove-unused-shield-check.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/revenue/RevenueLiveOpsPanel.tsx .github/workflows/remove-unused-shield-check.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove unused revenue live import"
          git push origin HEAD:feat/gpt-minimal-workspace

name: Apply GPT minimal workspace patch

on:
  push:
    branches:
      - feat/gpt-minimal-workspace
    paths:
      - .github/workflows/apply-gpt-minimal-workspace.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpt-minimal-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-time patch
        run: node .github/scripts/apply-gpt-minimal-workspace.mjs
      - name: Remove one-time files
        run: rm .github/scripts/apply-gpt-minimal-workspace.mjs .github/workflows/apply-gpt-minimal-workspace.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/revenue/RevenueLiveOpsPanel.tsx src/index.css .github/scripts/apply-gpt-minimal-workspace.mjs .github/workflows/apply-gpt-minimal-workspace.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: quiet workspace chrome and live copy"
          git push origin HEAD:feat/gpt-minimal-workspace

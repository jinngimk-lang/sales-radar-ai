name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sales_radar_ai?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: >-
          node --import tsx --test
          tests/agent-reach-provider.test.ts
          tests/agent-reach-runtime.test.ts
          tests/agent-reach-search-depth.test.ts
          tests/agent-runtime.test.ts
          tests/ai-provider-config.test.ts
          tests/ai-provider-platform.test.ts
          tests/assistant-lead-trust.test.ts
          tests/commercial-target-contract.test.ts
          tests/direct-search-enrichment.test.ts
          tests/exa-runtime-config.test.ts
          tests/market-live-browser.test.ts
          tests/market-live-api-contract.test.ts
          tests/market-research-goal.test.ts
          tests/market-search-resilience.test.ts
          tests/openai-runtime-verifier.test.ts
          tests/openai-sales-agent.test.ts
          tests/outreach-agent.test.ts
          tests/outreach-agent-human-tone.test.ts
          tests/revenue-domain.test.ts
          tests/revenue-persistence-security.test.ts
          tests/revenue-live-domain.test.ts
          tests/revenue-operator-auth.test.ts
          tests/browserbase-agent-provider.test.ts
          tests/crawl4ai-content-provider.test.ts
          tests/evidence-ranking.test.ts
          tests/revenue-live-service.test.ts
          tests/revenue-live-api-contract.test.ts
          tests/revenue-live-loop.test.ts
          tests/server-startup.test.ts
          tests/source-provenance.test.ts

      - name: Build
        run: npm run build

      - name: Build production runtime image
        run: docker build --file Dockerfile --tag sales-radar-backend:ci .

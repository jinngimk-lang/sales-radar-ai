name: Remove unused TrustItem helper

on:
  push:
    branches:
      - feat/gpt-minimal-workspace
    paths:
      - .github/workflows/remove-unused-trust-item.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpt-minimal-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove unused helper
        run: node .github/scripts/remove-unused-trust-item.mjs
      - name: Remove one-time files
        run: rm .github/scripts/remove-unused-trust-item.mjs .github/workflows/remove-unused-trust-item.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/revenue/RevenueLiveOpsPanel.tsx .github/scripts/remove-unused-trust-item.mjs .github/workflows/remove-unused-trust-item.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove unused revenue live helper"
          git push origin HEAD:feat/gpt-minimal-workspace

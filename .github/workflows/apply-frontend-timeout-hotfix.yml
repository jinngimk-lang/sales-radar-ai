name: Apply frontend API timeout hotfix

on:
  push:
    branches:
      - hotfix/frontend-runtime-loading
    paths:
      - .github/scripts/apply_frontend_timeout_hotfix.py
      - .github/workflows/apply-frontend-timeout-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/frontend-runtime-loading
          fetch-depth: 0
      - run: python3 .github/scripts/apply_frontend_timeout_hotfix.py
      - run: |
          rm .github/scripts/apply_frontend_timeout_hotfix.py
          rm .github/workflows/apply-frontend-timeout-hotfix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: timeout stalled frontend API requests"
          git push origin HEAD:hotfix/frontend-runtime-loading
